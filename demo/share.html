<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LiveForever share card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;1,300&family=Albert+Sans:wght@400;500;600&display=swap">
<style>
  /* 1200 x 630 Open Graph card, rendered to og.png by headless Chrome. Numbers come from record.json. */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(900px 500px at 78% 20%, rgba(232,171,79,0.10), transparent 60%), #0d1322;
    color: #ece6d8; font-family: "Albert Sans", sans-serif; position: relative;
  }
  .wordmark { position: absolute; left: 72px; top: 56px; font-family: Spectral, serif; font-size: 34px; }
  .wordmark::before { content: ""; display: inline-block; width: 13px; height: 13px; border-radius: 50%; background: #e8ab4f; box-shadow: 0 0 0 5px rgba(232,171,79,0.18); margin-right: 16px; vertical-align: 3px; }
  h1 { position: absolute; left: 72px; top: 160px; width: 600px; margin: 0; font-family: Spectral, serif; font-weight: 400; font-size: 60px; line-height: 1.08; letter-spacing: -0.01em; }
  .lede { position: absolute; left: 72px; top: 352px; width: 560px; font-family: Spectral, serif; font-size: 25px; line-height: 1.4; color: #c6bfaf; }
  .byline { position: absolute; left: 72px; bottom: 56px; width: 600px; font-size: 20px; color: #c6bfaf; }
  .byline b { color: #ece6d8; font-weight: 500; }
  .dial { position: absolute; right: 100px; top: 70px; width: 400px; height: 400px; }
  .dial svg { width: 400px; height: 400px; }
  .cap { position: absolute; right: 80px; bottom: 56px; width: 440px; text-align: center; line-height: 1.35; font-family: Spectral, serif; font-size: 20px; color: #c6bfaf; }
  .cap b { color: #ece6d8; font-weight: 500; }
</style>
</head>
<body>
  <div class="wordmark">LiveForever</div>
  <h1>One person's health history, read as evidence.</h1>
  <p class="lede">Wearable nights, habits, years of bloodwork and a genome in one record, with the uncertainty kept on screen.</p>
  <p class="byline"><b>Bakul Badwal</b> · Darden MBA '27 · built for OpenAI Build Week, July 2026</p>
  <div class="dial" id="dial"></div>
  <p class="cap" id="cap"></p>
  <script>
    fetch('record.json').then(function (r) { return r.json(); }).then(function (rec) {
      var h = rec.hero, size = 440, r = 176, cx = 220, cy = 220, sw = 14;
      var circ = 2 * Math.PI * r, frac = Math.min(1, h.phenoage / h.chronological_age_at_draw), dash = frac * circ;
      var pa = -Math.PI / 2 + frac * 2 * Math.PI;
      var ticks = '';
      for (var i = 0; i <= Math.round(h.chronological_age_at_draw); i++) {
        var a = -Math.PI / 2 + i / h.chronological_age_at_draw * 2 * Math.PI, inner = i % 5 ? r + 16 : r + 22, outer = r + 28;
        ticks += '<line x1="' + (cx + Math.cos(a) * inner) + '" y1="' + (cy + Math.sin(a) * inner) + '" x2="' + (cx + Math.cos(a) * outer) + '" y2="' + (cy + Math.sin(a) * outer) + '" stroke="' + (i % 5 ? 'rgba(236,230,216,0.16)' : '#958f82') + '" stroke-width="1.5"/>';
      }
      document.getElementById('dial').innerHTML = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' + ticks +
        '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="rgba(236,230,216,0.16)" stroke-width="' + sw + '"/>' +
        '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="#ece6d8" stroke-width="' + sw + '" stroke-linecap="round" stroke-dasharray="' + dash + ' ' + circ + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>' +
        '<circle cx="' + (cx + Math.cos(pa) * r) + '" cy="' + (cy + Math.sin(pa) * r) + '" r="11" fill="#0d1322" stroke="#ece6d8" stroke-width="3.5"/>' +
        '<text x="' + cx + '" y="' + (cy - 54) + '" text-anchor="middle" font-size="19" fill="#958f82" font-family="Albert Sans, sans-serif">biological age</text>' +
        '<text x="' + cx + '" y="' + (cy + 30) + '" text-anchor="middle" font-size="110" font-weight="300" fill="#ece6d8" font-family="Spectral, serif" letter-spacing="-0.02em">' + h.phenoage.toFixed(1) + '</text>' +
        '<text x="' + cx + '" y="' + (cy + 74) + '" text-anchor="middle" font-size="19" fill="#958f82" font-family="Albert Sans, sans-serif">calendar age ' + h.chronological_age_at_draw.toFixed(1) + '</text></svg>';
      document.getElementById('cap').innerHTML = '<b>' + Math.abs(h.gap_years).toFixed(1) + ' years ' + (h.gap_years < 0 ? 'younger' : 'older') + '</b> than her calendar age · a fictional person, synthetic data';
      document.title = 'ready';
    });
  </script>
</body>
</html>
