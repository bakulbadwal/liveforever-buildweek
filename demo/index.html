<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LiveForever is a privacy-first personal evidence lab for testing wellness questions with deterministic analysis.">
  <meta name="theme-color" content="#192628">
  <title>LiveForever | Personal Evidence Lab</title>
  <link rel="stylesheet" href="portfolio.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">LF</div>
        <div class="brand-copy">
          <strong>LiveForever</strong>
          <small>Personal evidence lab</small>
        </div>
      </div>

      <nav class="nav" aria-label="Primary navigation">
        <button class="nav-button active" type="button" data-view="overview" aria-current="page">Snapshot</button>
        <button class="nav-button" type="button" data-view="experiment" aria-current="false">Experiment</button>
        <button class="nav-button" type="button" data-view="data" aria-current="false">Data &amp; methods</button>
      </nav>

      <div class="sidebar-foot">
        <strong>Fictional demonstration</strong>
        Synthetic records only. No personal health information is included.
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <div class="persona">
          <div class="avatar" aria-hidden="true">MC</div>
          <div>
            <strong>Maya Chen</strong>
            <span>Fictional demo persona &middot; age 34</span>
          </div>
        </div>
        <div class="demo-badge">Synthetic demo</div>
      </header>

      <main class="content" id="app">
        <div class="loading">Loading the synthetic evidence record...</div>
      </main>

      <footer class="site-footer">
        <span>Built by Bakul Badwal for OpenAI Build Week 2026.</span>
        <nav aria-label="Project links">
          <a href="https://github.com/bakulbadwal/liveforever-buildweek" target="_blank" rel="noreferrer">GitHub</a>
          <a href="https://devpost.com/software/liveforever" target="_blank" rel="noreferrer">Devpost</a>
        </nav>
      </footer>
    </div>
  </div>

  <script src="portfolio.js"></script>
</body>
</html>
